# 复制为 docker-compose.yml 后使用（见 just dev-db / README）
# cp docker-compose.example.yml docker-compose.yml
# 端口与账号与根目录 .env 中变量一致（docker compose 会自动读取 .env）

services:
  postgres:
    image: postgres:16-alpine
    container_name: fullstack-rust-react-starter-postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
      POSTGRES_DB: ${POSTGRES_DB:-app}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-app} -d ${POSTGRES_DB:-app}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: fullstack-rust-react-starter-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - fullstack_rust_react_starter_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  fullstack_rust_react_starter_postgres_data:
  fullstack_rust_react_starter_redis_data:
